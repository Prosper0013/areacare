# Backup keep-alive. Vercel Cron already calls /api/cron/daily every morning;
# this pings it every 3 days from GitHub too, in case a Vercel cron run is ever skipped.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   APP_URL      e.g. https://areacare.vercel.app
#   CRON_SECRET  the same value as in Vercel
name: Keep database awake

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily job
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then echo "APP_URL secret not set — skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/daily"
